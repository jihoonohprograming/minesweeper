<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>비밀번호 변경 - minesweeper!!!</title>
<style>
:root{--line:#d1d5db;--muted:#6b7280;--text:#111827}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#f8fafc;color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:grid;place-items:center;padding:20px}
.card{width:min(460px,100%);background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 8px 30px rgba(0,0,0,.06)}
h1{margin:0 0 8px;font-size:28px}.desc{color:var(--muted);margin:0 0 18px;line-height:1.5}
label{display:grid;gap:6px;margin:12px 0;font-size:14px;font-weight:700}
input{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:16px}
button,.back{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:10px;padding:11px 14px;font-weight:800;font-size:15px;text-decoration:none;cursor:pointer}
button{width:100%;background:#111827;color:#fff;margin-top:8px}.back{width:100%;background:#fff;color:#111827;margin-top:10px}
.status{min-height:24px;margin-top:14px;padding:10px 12px;border-radius:10px;background:#f8fafc;color:#374151;white-space:pre-line}
.lang{display:flex;gap:6px;justify-content:flex-end;margin-bottom:12px}.lang button{width:auto;margin:0;padding:7px 10px;background:#fff;color:#4b5563}.lang button.active{background:#111827;color:#fff}
</style>
</head>
<body>
<div class="card">
  <div class="lang"><button id="koBtn" class="active">한국어</button><button id="enBtn">English</button></div>
  <h1 id="title">🔐 비밀번호 변경</h1>
  <p class="desc" id="desc">현재 로그인된 계정의 비밀번호를 새 비밀번호로 변경합니다.</p>
  <label><span id="newLabel">새 비밀번호</span><input id="newPassword" type="password" autocomplete="new-password" minlength="6" placeholder="6자 이상"></label>
  <label><span id="confirmLabel">새 비밀번호 확인</span><input id="confirmPassword" type="password" autocomplete="new-password" minlength="6" placeholder="한 번 더 입력"></label>
  <button id="changeBtn">비밀번호 변경</button>
  <a class="back" id="backBtn" href="./">← 게임으로 돌아가기</a>
  <div id="status" class="status">로그인 상태를 확인하는 중...</div>
</div>
<script type="module">
const SUPABASE_URL='https://ebfbzwawqjipvifaspov.supabase.co';
const SUPABASE_KEY='sb_publishable_YqqSRLyqZDfCA146o2rPfQ_bWO1ayBz';
const mod=await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');
const sb=mod.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const status=document.getElementById('status');
let lang='ko', user=null;
const T={
 ko:{title:'🔐 비밀번호 변경',desc:'현재 로그인된 계정의 비밀번호를 새 비밀번호로 변경합니다.',newLabel:'새 비밀번호',confirmLabel:'새 비밀번호 확인',newPh:'6자 이상',confirmPh:'한 번 더 입력',change:'비밀번호 변경',back:'← 게임으로 돌아가기',checking:'로그인 상태를 확인하는 중...',needLogin:'먼저 게임 사이트에서 로그인해줘.',logged:'로그인됨: ',short:'새 비밀번호는 6자 이상이어야 해.',mismatch:'두 비밀번호가 서로 달라.',working:'비밀번호를 변경하는 중...',done:'✅ 비밀번호가 변경됐어!',failed:'비밀번호 변경 실패: '},
 en:{title:'🔐 Change Password',desc:'Change the password for the account currently signed in.',newLabel:'New password',confirmLabel:'Confirm new password',newPh:'At least 6 characters',confirmPh:'Enter it again',change:'Change Password',back:'← Back to game',checking:'Checking login status...',needLogin:'Please sign in on the game site first.',logged:'Signed in: ',short:'The new password must be at least 6 characters.',mismatch:'The passwords do not match.',working:'Changing password...',done:'✅ Password changed!',failed:'Password change failed: '}
};
function applyLang(){const t=T[lang];document.documentElement.lang=lang;document.getElementById('title').textContent=t.title;document.getElementById('desc').textContent=t.desc;document.getElementById('newLabel').textContent=t.newLabel;document.getElementById('confirmLabel').textContent=t.confirmLabel;document.getElementById('newPassword').placeholder=t.newPh;document.getElementById('confirmPassword').placeholder=t.confirmPh;document.getElementById('changeBtn').textContent=t.change;document.getElementById('backBtn').textContent=t.back;document.getElementById('koBtn').classList.toggle('active',lang==='ko');document.getElementById('enBtn').classList.toggle('active',lang==='en');}
document.getElementById('koBtn').onclick=()=>{lang='ko';applyLang();status.textContent=user?T[lang].logged+(user.email||''):T[lang].needLogin};
document.getElementById('enBtn').onclick=()=>{lang='en';applyLang();status.textContent=user?T[lang].logged+(user.email||''):T[lang].needLogin};
applyLang();status.textContent=T[lang].checking;
const {data,error}=await sb.auth.getSession();
if(error){status.textContent=T[lang].failed+error.message}else{user=data.session?.user||null;status.textContent=user?T[lang].logged+(user.email||''):T[lang].needLogin;}
sb.auth.onAuthStateChange((_event,session)=>{user=session?.user||null;status.textContent=user?T[lang].logged+(user.email||''):T[lang].needLogin;});
document.getElementById('changeBtn').addEventListener('click',async()=>{
 const t=T[lang];
 if(!user){status.textContent=t.needLogin;return;}
 const p1=document.getElementById('newPassword').value;
 const p2=document.getElementById('confirmPassword').value;
 if(p1.length<6){status.textContent=t.short;return;}
 if(p1!==p2){status.textContent=t.mismatch;return;}
 status.textContent=t.working;
 const {error}=await sb.auth.updateUser({password:p1});
 if(error){status.textContent=t.failed+error.message;return;}
 document.getElementById('newPassword').value='';
 document.getElementById('confirmPassword').value='';
 status.textContent=t.done;
});
</script>
</body>
</html>

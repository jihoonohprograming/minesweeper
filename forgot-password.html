<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>비밀번호 찾기 - minesweeper!!!</title>
<style>
:root{--line:#d1d5db;--muted:#6b7280;--text:#111827}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#f8fafc;color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:grid;place-items:center;padding:20px}
.card{width:min(460px,100%);background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 8px 30px rgba(0,0,0,.06)}
h1{margin:0 0 8px;font-size:28px}.desc{color:var(--muted);margin:0 0 18px;line-height:1.55}
label{display:grid;gap:6px;margin:12px 0;font-size:14px;font-weight:700}
input{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:16px}
button,.back{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:10px;padding:11px 14px;font-weight:800;font-size:15px;text-decoration:none;cursor:pointer}
button.send{width:100%;background:#111827;color:#fff;margin-top:8px}.back{width:100%;background:#fff;color:#111827;margin-top:10px}
.status{min-height:24px;margin-top:14px;padding:10px 12px;border-radius:10px;background:#f8fafc;color:#374151;white-space:pre-line}
.lang{display:flex;gap:6px;justify-content:flex-end;margin-bottom:12px}.lang button{width:auto;margin:0;padding:7px 10px;background:#fff;color:#4b5563}.lang button.active{background:#111827;color:#fff}
</style>
</head>
<body>
<div class="card">
  <div class="lang"><button id="koBtn" class="active">한국어</button><button id="enBtn">English</button></div>
  <h1 id="title">🔑 비밀번호를 잊으셨나요?</h1>
  <p class="desc" id="desc">가입할 때 사용한 이메일을 입력하면 비밀번호 재설정 링크를 보내줄게.</p>
  <label><span id="emailLabel">로그인 이메일</span><input id="email" type="email" autocomplete="email" placeholder="name@example.com"></label>
  <button class="send" id="sendBtn">재설정 이메일 보내기</button>
  <a class="back" id="backBtn" href="./">← 로그인 화면으로 돌아가기</a>
  <div id="status" class="status">이메일을 입력해줘.</div>
</div>
<script type="module">
const SUPABASE_URL='https://ebfbzwawqjipvifaspov.supabase.co';
const SUPABASE_KEY='sb_publishable_YqqSRLyqZDfCA146o2rPfQ_bWO1ayBz';
const mod=await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');
const sb=mod.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const status=document.getElementById('status');
let lang='ko';
const T={
 ko:{title:'🔑 비밀번호를 잊으셨나요?',desc:'가입할 때 사용한 이메일을 입력하면 비밀번호 재설정 링크를 보내줄게.',email:'로그인 이메일',send:'재설정 이메일 보내기',back:'← 로그인 화면으로 돌아가기',empty:'가입할 때 사용한 이메일을 입력해줘.',sending:'비밀번호 재설정 이메일을 보내는 중...',sent:'✅ 재설정 이메일을 보냈어. 받은편지함과 스팸함을 확인해줘.',failed:'이메일 전송 실패: '},
 en:{title:'🔑 Forgot your password?',desc:'Enter the email address you used to sign up and we will send you a password reset link.',email:'Login email',send:'Send reset email',back:'← Back to login',empty:'Enter the email address you used to sign up.',sending:'Sending password reset email...',sent:'✅ Reset email sent. Check your inbox and spam folder.',failed:'Failed to send email: '}
};
function applyLang(){const t=T[lang];document.documentElement.lang=lang;document.getElementById('title').textContent=t.title;document.getElementById('desc').textContent=t.desc;document.getElementById('emailLabel').textContent=t.email;document.getElementById('sendBtn').textContent=t.send;document.getElementById('backBtn').textContent=t.back;document.getElementById('koBtn').classList.toggle('active',lang==='ko');document.getElementById('enBtn').classList.toggle('active',lang==='en');}
document.getElementById('koBtn').onclick=()=>{lang='ko';applyLang();};
document.getElementById('enBtn').onclick=()=>{lang='en';applyLang();};
applyLang();
document.getElementById('sendBtn').addEventListener('click',async()=>{
 const t=T[lang];
 const email=document.getElementById('email').value.trim();
 if(!email){status.textContent=t.empty;return;}
 status.textContent=t.sending;
 const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:'https://jihoonohprograming.github.io/minesweeper/password.html'});
 if(error){status.textContent=t.failed+error.message;return;}
 status.textContent=t.sent;
});
</script>
</body>
</html>
